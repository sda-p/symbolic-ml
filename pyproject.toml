[project]
name = "symbolic-ml"
version = "0.0.1"
description = "Experiments in SGD-like training of symbolic models"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.1",
    "matplotlib>=3.9",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/symbolic_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
